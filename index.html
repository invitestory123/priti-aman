<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="Priti &amp; Aman — Wedding Invitation" />
    <meta property="og:description" content="Together with their families, Aman &amp; Priti invite you to share in the joy of their wedding celebration on Wednesday, 25th November 2026 at GRAND ORCHID WEDDING LAWN, Thane." />

    <style>
      #music-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(253, 251, 247, 0.94);
        border: 1.5px solid #c89b3c;
        box-shadow: 0 4px 16px rgba(43, 36, 28, 0.16), 0 0 10px rgba(200, 155, 60, 0.25);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #music-toggle:hover {
        transform: scale(1.08);
        border-color: #d4af37;
        box-shadow: 0 6px 20px rgba(43, 36, 28, 0.22), 0 0 14px rgba(200, 155, 60, 0.4);
      }
      #music-toggle:active {
        transform: scale(0.94);
      }
      #music-toggle .music-icon-playing {
        display: none;
        animation: musicDiscSpin 4s linear infinite;
      }
      #music-toggle .music-icon-paused {
        display: block;
      }
      #music-toggle.playing .music-icon-playing {
        display: block;
      }
      #music-toggle.playing .music-icon-paused {
        display: none;
      }
      @keyframes musicDiscSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Player -->
    <audio id="wedding-audio" loop preload="auto" src="./editable/assets/bgm.mp3"></audio>

    <!-- Floating Music Toggle Controller -->
    <button id="music-toggle" aria-label="Toggle background music" title="Toggle background music">
      <svg class="music-icon-playing" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8c6d23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3" fill="#8c6d23"></circle>
        <circle cx="18" cy="16" r="3" fill="#8c6d23"></circle>
      </svg>
      <svg class="music-icon-paused" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8c6d23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        <line x1="2" y1="2" x2="22" y2="22" stroke="#8c6d23"></line>
      </svg>
    </button>

    <script>
      (function() {
        function initMusic() {
          var audio = document.getElementById('wedding-audio');
          var toggle = document.getElementById('music-toggle');
          if (!audio || !toggle) return;

          if (window.WEDDING_DATA && window.WEDDING_DATA.bgm && window.WEDDING_DATA.bgm.src) {
            audio.src = window.WEDDING_DATA.bgm.src;
          }

          var isStarted = false;

          function updateState() {
            if (!audio.paused) {
              toggle.classList.add('playing');
              toggle.setAttribute('aria-label', 'Pause background music');
              toggle.title = 'Pause background music';
            } else {
              toggle.classList.remove('playing');
              toggle.setAttribute('aria-label', 'Play background music');
              toggle.title = 'Play background music';
            }
          }

          function playMusic() {
            var promise = audio.play();
            if (promise !== undefined) {
              promise.then(function() {
                isStarted = true;
                updateState();
              }).catch(function(err) {
                console.log('Autoplay requires user interaction:', err);
              });
            }
          }

          toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            if (audio.paused) {
              playMusic();
            } else {
              audio.pause();
              updateState();
            }
          });

          function onFirstInteraction() {
            if (!isStarted && audio.paused) {
              playMusic();
            }
            window.removeEventListener('click', onFirstInteraction, true);
            window.removeEventListener('touchstart', onFirstInteraction, true);
          }

          window.addEventListener('click', onFirstInteraction, true);
          window.addEventListener('touchstart', onFirstInteraction, true);

          audio.addEventListener('play', updateState);
          audio.addEventListener('pause', updateState);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initMusic);
        } else {
          initMusic();
        }
      })();
    </script>
  </body>
</html>
